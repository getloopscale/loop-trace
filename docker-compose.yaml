# One-command stack for LoopTrace (M7).
#
# Two services: a plain Postgres (no pgvector — blueprint D2) and the API. The
# API migrates the schema on boot and serves BOTH the ingestion API (/v1/*) and
# the Trace Explorer UI at the same port (same-origin, no CORS — M7 D1), so the
# whole stack is reachable at http://localhost:4318 from a clean checkout. Usage:
#   docker compose up -d postgres   # DB only (for integration tests)
#   docker compose up -d            # full stack: API + UI at http://localhost:4318

services:
  postgres:
    image: postgres:16-alpine
    container_name: looptrace_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LOOPTRACE_PG_USER:-looptrace}
      POSTGRES_PASSWORD: ${LOOPTRACE_PG_PASSWORD:-looptrace}
      POSTGRES_DB: ${LOOPTRACE_PG_DB:-looptrace}
    ports:
      - "${LOOPTRACE_PG_PORT:-5432}:5432"
    volumes:
      - looptrace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOOPTRACE_PG_USER:-looptrace} -d ${LOOPTRACE_PG_DB:-looptrace}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: looptrace_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LOOPTRACE_PG_URI: postgresql://${LOOPTRACE_PG_USER:-looptrace}:${LOOPTRACE_PG_PASSWORD:-looptrace}@postgres:5432/${LOOPTRACE_PG_DB:-looptrace}
      LOOPTRACE_PORT: "4318"
      # Pass-through runtime config. Defaulted so a clean `docker compose up` still works, and
      # supplied by the dev host's .env at deploy — the values are secrets and never live here.
      LOOPTRACE_REQUIRE_CREDENTIAL: ${LOOPTRACE_REQUIRE_CREDENTIAL:-false}
      LOOPTRACE_PLATFORM_ADMIN_BOOTSTRAP: ${LOOPTRACE_PLATFORM_ADMIN_BOOTSTRAP:-}
      LOOPTRACE_JUDGE_BASE_URL: ${LOOPTRACE_JUDGE_BASE_URL:-}
      LOOPTRACE_JUDGE_API_KEY: ${LOOPTRACE_JUDGE_API_KEY:-}
      DISABLE_ERROR_REPORTING: ${DISABLE_ERROR_REPORTING:-0}
    ports:
      - "${LOOPTRACE_API_PORT:-4318}:4318"
    healthcheck:
      # LIVENESS only, never readiness. A DB blip must not make Docker restart a process that is
      # perfectly alive; readiness is a different question, asked by the deploy gate and the LB.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4318/v1/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  looptrace_pgdata:
    name: looptrace_pgdata
