# Build, publish, and deploy — the two triggers of the ecosystem CD playbook.
#
#   develop push  → build → GHCR :develop → deploy dev (three gates)
#   tag v* push   → build → GHCR :X.Y.Z :latest → SBOM + keyless cosign → deploy SKIPPED
#
# A tag NEVER touches the dev host. The production host is provisioned separately, and a release
# build that silently redeployed dev would make "what is on dev?" unanswerable.
name: Publish

on:
  push:
    branches: [develop]
    tags: ["v*"]
    # M137 review (F-sec-6). The filter MUST live here, in the caller: a callee's `paths` /
    # `paths-ignore` is NOT evaluated for a `workflow_call` invocation, so without this a docs-only
    # develop push ran ci + integration + sast in full through the gates.
    #
    # DENYLIST here, not the allowlist ADR D2 argued for — and the reversal is deliberate. This
    # trigger also listens on `tags: ["v*"]`, and a path filter applies to tag pushes too: a POSITIVE
    # list would make a release whose commit happened not to match it vanish silently — no image, no
    # error. Exclusion errs toward publishing too much, which is the correct side here. The practical
    # half of the argument is that the first draft's allowlist omitted `scripts/**` (executed by
    # `pnpm build`), `test/**`, `tests/**`, `Dockerfile` and `drizzle.config.ts` — an open-ended
    # "what is code" list is exactly what an allowlist is bad at enumerating.
    paths-ignore:
      - '.claude/**'
      - '**/*.md'
      - 'docs/**'
      - 'knowledge-base/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false # never cancel a half-pushed image

jobs:
  # ── M137: the gates. Nothing below reaches GHCR before these pass. ────────────────────────────
  #
  # WHY `needs:` AND NOT `workflow_run`. `workflow_run` is evaluated ONLY in the default branch's
  # definition and runs in its context, so the very commit that adds a gate ships ungated. Measured
  # across five OSS peers (opik, langfuse, phoenix, argo-cd, compose): all 5 uses of `workflow_run`
  # are post-publication verification or fork-privilege isolation — none is a gate. Two of them say
  # so in their own comments. `needs:` is evaluated BEFORE the dependent job starts, so on a red
  # commit no registry credential is ever acquired and there is no partial push to unwind.
  #
  # COST — components measured, composite PROJECTED (M137 review, F-xval-6). Medians of successful
  # runs on 2026-07-28: publish 103 s, integration 84 s, ci 55 s, sast 40 s. The gated path is
  # therefore max(55, 84, 40) + 103 ≈ 187 s → +84 s (+82%). The ≈ is the honest part: no gated
  # end-to-end run had been observed when this was written, so the composite is arithmetic on
  # measured parts, not an observed duration. Paid deliberately against theo-memory's measured 8.2%
  # of pushes that published an image with the suite red on the same commit. If it bites, the lever
  # is opik's registry layer cache, not removing the gate.
  gate-ci:
    uses: ./.github/workflows/ci.yml

  gate-contract:
    uses: ./.github/workflows/integration.yml

  # F-sec-3 — semgrep gates too. It was named in the defect statement and left ungated.
  gate-sast:
    uses: ./.github/workflows/security-sast.yml

  # ── M137: `:latest` may only come from code that reached main ─────────────────────────────────
  #
  # `:latest` feeds reconciliation. A tag cut from an unpromoted commit would publish it from code
  # that never passed through develop → main. Resolved through the API rather than `git merge-base`
  # so no checkout is needed — this repo's full history is expensive to fetch.
  guard-release-on-main:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: A tag esta contida em main?
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${SHA}" --jq .status)"
          echo "posicao de ${SHA} em relacao a main: ${STATUS}"
          case "${STATUS}" in
            identical|behind)
              echo "OK — a tag esta em main; :latest pode ser publicada." ;;
            *)
              echo "::error::A tag ${GITHUB_REF_NAME} NAO esta em main (${STATUS})." >&2
              echo "::error::':latest' alimenta a reconciliacao e so pode sair de codigo promovido." >&2
              exit 1 ;;
          esac

  image:
    # M137 — the gate. Removing this line reopens the hole that published rejected artifacts;
    # `packages/api/src/server/publish-gate.test.ts` fails if it goes.
    needs: [gate-ci, gate-contract, gate-sast, guard-release-on-main]
    uses: ./.github/workflows/build-publish.yml
    with:
      image: theo-lens
      dockerfile: ./Dockerfile
      trivy: true
      # Signing is release-only: a keyless cosign signature is a claim about a released artifact,
      # and signing every develop build would make the signature mean nothing.
      sign: ${{ startsWith(github.ref, 'refs/tags/v') }}
      verify: ${{ startsWith(github.ref, 'refs/tags/v') }}

  deploy-dev:
    needs: image
    # A tag build stops here. `needs: image` rather than `workflow_run` because `workflow_run` only
    # fires from the DEFAULT branch (main), so a develop-only deploy wired that way never runs at
    # all — a documented failure from theo-rag's pipeline.
    if: ${{ github.ref == 'refs/heads/develop' }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: read
    steps:
      - name: Configure SSH deploy key
        run: |
          install -m700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEV_SSH_KEY }}" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -H "${{ vars.DEV_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Provision runtime env
        # Written over STDIN, never argv: an argument is visible in the host's process list to
        # every other tenant of this shared box.
        # Segredos chegam por `env:` e o `.env` remoto e montado com `printf`, NAO por heredoc
        # expansivel. O heredoc `<<EOF` (nao citado) fazia o shell do runner expandir o CONTEUDO
        # dos segredos: um `$(...)`, crase ou `$VAR` dentro de um valor viraria execucao ou
        # corromperia o arquivo remoto em silencio. Era tambem o SC2087 que o actionlint apontou.
        #
        # `printf '%s\n'` com cada linha entre aspas trata todo valor como literal. `${SHA}` e
        # `${BUILT}` continuam expandindo — eles PRECISAM, sao a proveniencia que o /version le —
        # mas agora expandem sozinhos, sem arrastar os segredos pelo mesmo mecanismo.
        env:
          BOOTSTRAP: ${{ secrets.THEOLENS_PLATFORM_ADMIN_BOOTSTRAP }}
          JUDGE_KEY: ${{ secrets.THEOLENS_JUDGE_API_KEY }}
          JUDGE_URL: ${{ vars.THEOLENS_JUDGE_BASE_URL }}
        run: |
          SHA='${{ github.sha }}'
          BUILT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '%s\n' \
            "THEOLENS_API_PORT=18084" \
            "THEOLENS_PG_PORT=5434" \
            "THEOLENS_REQUIRE_CREDENTIAL=true" \
            "THEOLENS_PLATFORM_ADMIN_BOOTSTRAP=${BOOTSTRAP}" \
            "THEOLENS_JUDGE_BASE_URL=${JUDGE_URL}" \
            "THEOLENS_JUDGE_API_KEY=${JUDGE_KEY}" \
            "DISABLE_ERROR_REPORTING=1" \
            "THEOLENS_GIT_SHA=${SHA}" \
            "THEOLENS_VERSION=develop-${SHA:0:7}" \
            "THEOLENS_BUILD_TIME=${BUILT}" \
          | ssh -i ~/.ssh/k root@"${{ vars.DEV_HOST }}" 'cat > ${{ vars.DEV_DEPLOY_DIR }}/.env'

      - name: Sync checkout, log into GHCR, deploy
        run: |
          ssh -i ~/.ssh/k root@"${{ vars.DEV_HOST }}" bash -s <<'REMOTE'
          set -euo pipefail
          DIR='${{ vars.DEV_DEPLOY_DIR }}'
          # root operating a user-owned checkout; without this git refuses with "dubious ownership".
          git config --global --add safe.directory "$DIR"
          cd "$DIR"
          # The deploy script lives in the repo, so the checkout must reach the published commit
          # BEFORE it is invoked — otherwise the box runs the previous version of its own deploy.
          git fetch -q origin develop
          git reset --hard -q '${{ github.sha }}'
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          EXPECTED_SHA='${{ github.sha }}' bash scripts/deploy-dev.sh
          REMOTE

      - name: Remove deploy key
        if: always()
        run: rm -f ~/.ssh/k
