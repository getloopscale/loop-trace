name: sdk-py

# Scoped Python job for packages/sdk-py (M124). The repo had no CI workflows before this — this is
# additive and only runs when the SDK or its shared fixture changes. The hermetic engine e2e
# (tests/test_e2e_engine.py) skips here (its LOOPTRACE_E2E_* env vars are unset).
# O `push` é FILTRADO por branch. Sem `branches:`, um `push` com apenas `paths:` dispara em
# QUALQUER branch — inclusive `workspace`, onde todo trabalho nasce. Commit em `workspace` não
# aciona esteira (decisão do dono, 2026-08-08); a matriz 3.9/3.12 em runner self-hosted rodava
# a cada commit que tocasse o SDK. A cobertura vem do `pull_request` (mesmo filtro de paths).
on:
  push:
    branches: [develop, main]
    paths:
      - "packages/sdk-py/**"
      - "packages/core/src/domain/theokit/theokit-vectors.json"
      - ".github/workflows/sdk-py.yml"

jobs:
  test:
    # Self-hosted — GitHub-hosted minutes are billing-blocked org-wide, so an ubuntu-latest job
    # never starts ("The job was not started because recent account payments have failed").
    # These two lanes had been silently red on every commit for that reason alone.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: packages/sdk-py
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable + dev)
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy .
      - name: Pytest
        run: python -m pytest -q
