# O gate que faltava. Este repo tinha 5 workflows e nenhum verificava build, tipos ou lint
# — 682 arquivos com commits diarios sem nenhum desses tres gates (medido no CM0).
#
# ORDEM DOS STEPS IMPORTA: Build vem ANTES de Lint. As regras `@typescript-eslint/no-unsafe-*`
# sao TYPE-AWARE: num checkout limpo, sem `dist/`, os imports entre pacotes do workspace
# resolvem para `any` e disparam erros em codigo intocado. Foi o defeito que ficou meses
# invisivel no theo-memory, mascarado por instabilidade do runner self-hosted.
name: CI
on:
  # M137 — callable as a gate. `publish.yml` runs this as `gate-ci` BEFORE the image job, so a red
  # suite produces zero GHCR pushes. Deliberately declares NO `secrets:`: `workflow_call` hands
  # whatever it declares to every future caller, and this workflow needs none (plan R2).
  workflow_call:
  # NOT filtered, on purpose. A path filter on `pull_request` makes a docs-only PR sit forever with
  # the check "expected" but never reported — GitHub does not mark a filtered-out required check as
  # passed, it simply never arrives. The queue saving is on `push` (where there is no reviewer
  # waiting); on a PR the cost of a wasted run is lower than the cost of an unmergeable PR.
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
    # M137 / ADR D2 — a POSITIVE allowlist, not `paths-ignore`.
    #
    # Measured across five peers (opik, langfuse, phoenix, argo-cd, compose): `paths:` 45 uses vs
    # `paths-ignore:` 3. The failure modes are asymmetric and that is the whole argument — a denylist
    # fails SILENTLY (a new top-level directory is included by default and burns the shared runner
    # until someone reads the bill), an allowlist fails LOUDLY (the job does not run; nothing goes
    # green). `.github/workflows/**` is in the list on purpose: a change to the pipeline must be
    # tested by the pipeline.
    paths:
      - 'packages/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'vitest.*.config.ts'
      - 'eslint.config.js'
permissions:
  contents: read
jobs:
  ci:
    name: build + typecheck + lint
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        # SEM `version:`. A action le `packageManager` do package.json; declarar nos dois
        # lugares cria duas fontes de verdade que divergem em silencio ate a action abortar
        # com "Multiple versions of pnpm specified" — foi o que derrubou o `integration`
        # deste repo minutos atras.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0

      # Mesmo SHA e mesma versao de Node que o  deste repo ja usa e que
      # acabou de rodar verde na Blacksmith — nao introduzo uma segunda configuracao de
      # runtime para o mesmo repositorio.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test
