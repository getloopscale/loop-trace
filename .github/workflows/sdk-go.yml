name: sdk-go

# Scoped to the stdlib-only Go ingest client (M125) so the Go toolchain never runs on the
# TS-only rest of the pnpm monorepo. This is the first workflow in the repo.
on:
  push:
    branches: [develop, main]
    # Commit só-de-documentação não exercita código e não deve consumir a fila do runner compartilhado: cada repositório tem seu PRÓPRIO processo de runner, mas os cinco
    # rodam no MESMO host de 2 vCPU / 2 GB. A disputa é por CPU e RAM, não por um slot de fila —
    # medido em 2026-07-27: os runners de theo-rag, theo-memory, theo-cloud e theo-db aparecem
    # `busy=true` simultaneamente. Cada job desperdiçado aqui rouba CPU dos outros quatro repos. Medido em 2026-07-27: 47% dos últimos
    # 40 commits deste repo tocam apenas .md / docs/ / knowledge-base/ / .claude/.
    # Mesmo padrão já adotado em theo-memory.
    paths-ignore:
      - '.claude/**'
      - '**/*.md'
      - 'docs/**'
      - 'knowledge-base/**'
    paths:
      - "packages/sdk-go/**"
      - ".github/workflows/sdk-go.yml"
  pull_request:
    paths:
      - "packages/sdk-go/**"
      - ".github/workflows/sdk-go.yml"

jobs:
  build-test-lint:
    # Self-hosted — GitHub-hosted minutes are billing-blocked org-wide, so an ubuntu-latest job
    # never starts ("The job was not started because recent account payments have failed").
    # These two lanes had been silently red on every commit for that reason alone.
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: packages/sdk-go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6
        with:
          version: v2.1
          working-directory: packages/sdk-go

      - name: Test (race)
        run: go test -race ./...
