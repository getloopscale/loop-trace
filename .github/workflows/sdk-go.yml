name: sdk-go

# Scoped to the stdlib-only Go ingest client (M125) so the Go toolchain never runs on the
# TS-only rest of the pnpm monorepo. This is the first workflow in the repo.
on:
  push:
    branches: [develop, main]
    # Commit só-de-documentação não exercita código e não deve consumir a fila do runner compartilhado: cada repositório tem seu PRÓPRIO processo de runner, mas os cinco
    # rodam no MESMO host de 2 vCPU / 2 GB. A disputa é por CPU e RAM, não por um slot de fila —
    # medido em 2026-07-27: os runners de theo-rag, theo-memory, theo-cloud e theo-db aparecem
    # `busy=true` simultaneamente. Cada job desperdiçado aqui rouba CPU dos outros quatro repos. Medido em 2026-07-27: 47% dos últimos
    # 40 commits deste repo tocam apenas .md / docs/ / knowledge-base/ / .claude/.
    # Mesmo padrão já adotado em theo-memory.
    # SEM `paths-ignore` junto de `paths`. O GitHub PROIBE os dois filtros no mesmo evento, e
    # a recusa nao e um aviso: o workflow morre no PARSE, sem criar job algum e sem log. Foi o
    # que manteve este gate vermelho em TODOS os runs — `jobs=0`, `runner_name` vazio, nada na
    # aba Actions explicando por que.
    #
    # `paths` sozinho ja expressa a intencao: rodar so quando o SDK Go ou este arquivo mudam.
    # Um commit so-de-documentacao fora de `packages/sdk-go/**` nao dispara o workflow de todo
    # jeito, entao o `paths-ignore` nao acrescentava filtragem — so o erro de parse.
    paths:
      - "packages/sdk-go/**"
      - ".github/workflows/sdk-go.yml"

jobs:
  build-test-lint:
    # Self-hosted — GitHub-hosted minutes are billing-blocked org-wide, so an ubuntu-latest job
    # never starts ("The job was not started because recent account payments have failed").
    # These two lanes had been silently red on every commit for that reason alone.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        # Action v9.3.0 + golangci-lint v2.6.0 — o MESMO par ja verde em theo-storage.
        # O par anterior (action v6 + version v2.1) era INCOMPATIVEL, e a propria action dizia:
        # "golangci-lint v2 is not supported by golangci-lint-action v6, you must update to v7".
        # Resultado: 8 de 8 runs vermelhos, em develop e workspace. Nao era flaky nem lento —
        # era uma combinacao que nunca poderia funcionar.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.6.0
          working-directory: packages/sdk-go

      - name: Test (race)
        run: go test -race ./...
