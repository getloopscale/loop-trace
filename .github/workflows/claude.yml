# Trazido de `main` para `develop` e FIXADO POR SHA (release v0.63.0).
#
# Este arquivo e o `claude.yml` foram commitados DIRETAMENTE em `main` (commits "Claude Code Review
# workflow" e "Claude PR Assistant workflow"), fora do fluxo workspace → develop → main, e por isso
# não existiam em `develop`. O gate de SAST do PR de release os viu pela primeira vez — o checkout
# de um `pull_request` é o merge commit, que junta os dois lados — e reprovou com 4 findings
# `github-actions-mutable-action-tag`.
#
# O achado é legítimo: `actions/checkout@v4` e `claude-code-action@v1` são refs MUTÁVEIS, num
# repositório que fixa todas as outras 40 actions por SHA de 40 caracteres. Tag pode ser repontada
# em silêncio pelo dono da action — foi assim nos comprometimentos da `trivy-action` e da
# `kics-github-action`. A disciplina de supply-chain não pode valer para as dependências e falhar
# justamente nos workflows que ninguém revisou porque entraram por fora.
#
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'

